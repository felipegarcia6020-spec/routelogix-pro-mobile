<!DOCTYPE html>
<html lang="es" class="h-full bg-neutral-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RouteLogix Pro & Routin - Mobile TaT</title>
    
    <meta name="theme-color" content="#09090b">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="./manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">

    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-full text-gray-200 bg-neutral-950 flex flex-col justify-between selection:bg-blue-600 selection:text-white overflow-hidden">

    <!-- TOP APP BAR -->
    <header class="bg-neutral-900 border-b border-neutral-800 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-md">
        <div class="flex items-center space-x-3">
            <h1 id="header-title" class="font-bold text-base text-white tracking-wide">RouteLogix Pro</h1>
        </div>
        <div class="flex items-center space-x-2">
            <button onclick="switchTab('finances')" class="p-1.5 bg-neutral-800 hover:bg-neutral-700 text-emerald-400 rounded-lg flex items-center space-x-1 text-xs font-semibold border border-neutral-700">
                <i data-lucide="wallet" class="w-4 h-4"></i>
                <span id="header-net-badge">$0</span>
            </button>
            <button onclick="document.getElementById('import-file-input').click()" class="text-neutral-400 hover:text-white p-1.5 rounded-lg active:bg-neutral-800" title="Importar .bin / JSON de Routin">
                <i data-lucide="folder-open" class="w-4 h-4"></i>
            </button>
            <input type="file" id="import-file-input" class="hidden" accept=".bin,.json" onchange="importarArchivoRoutin(event)">
        </div>
    </header>

    <!-- MAIN MOBILE VIEW CONTAINER -->
    <main class="flex-1 overflow-y-auto w-full mx-auto pb-20 relative flex flex-col">

        <!-- VIEW 1: MAP & ROUTE WORKSPACE (Mobile Optimized) -->
        <section id="view-map" class="flex-1 flex flex-col relative h-full">
            <div id="map" class="w-full flex-1 absolute inset-0 z-0"></div>
            
            <!-- MIRA / CROSSHAIR CENTRAL DE PRECISIÓN (Requisito 1) -->
            <div class="map-crosshair absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-20 flex items-center justify-center">
                <div class="w-8 h-8 border-2 border-dashed border-blue-500 rounded-full animate-spin" style="animation-duration: 12s;"></div>
                <div class="absolute w-2 h-2 bg-rose-500 rounded-full shadow-[0_0_8px_#f43f5e]"></div>
            </div>

            <!-- BOTÓN FLOTANTE GPS (Requisito 2 y 5) -->
            <button onclick="centrarGPS()" class="absolute bottom-20 left-4 z-20 w-12 h-12 bg-neutral-900/90 backdrop-blur border border-neutral-700 rounded-full flex items-center justify-center text-blue-400 shadow-xl active:scale-95 transition">
                <i data-lucide="navigation" class="w-5 h-5"></i>
            </button>

            <!-- BOTÓN FLOTANTE INFERIOR PARA AÑADIR PARADA EN EL CENTRO DE LA MIRA -->
            <div class="absolute bottom-4 left-0 right-0 z-20 px-4 flex gap-2">
                <button onclick="abrirModalParadaCentro()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white font-bold py-3 px-4 rounded-xl shadow-2xl flex items-center justify-center gap-2 border border-blue-500/50 text-xs active:scale-95 transition">
                    <i data-lucide="map-pin-plus" class="w-4 h-4"></i> Añadir Parada aquí
                </button>
                <button onclick="optimizarRuta()" class="bg-cyan-600 hover:bg-cyan-500 text-white font-bold py-3 px-4 rounded-xl shadow-2xl flex items-center justify-center gap-1 text-xs active:scale-95 transition" title="Optimizar Ruta">
                    <i data-lucide="zap" class="w-4 h-4"></i> Optimizar
                </button>
            </div>
        </section>

        <!-- VIEW 2: STOPS & ROUTE LIST -->
        <section id="view-routes" class="p-4 space-y-3 hidden flex-1 bg-neutral-950">
            <div class="flex justify-between items-center">
                <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Paradas de la Ruta Activa</h2>
                <button onclick="borrarRutaActiva()" class="text-xs text-rose-400 hover:underline">Borrar Ruta</button>
            </div>
            <div id="lista-paradas" class="space-y-2.5"></div>
        </section>

        <!-- VIEW 3: AGENDA DE CLIENTES (Requisito 3) -->
        <section id="view-agenda" class="p-4 space-y-3 hidden flex-1 bg-neutral-950">
            <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Agenda General de Clientes</h2>
            <div id="lista-agenda" class="space-y-2.5"></div>
        </section>

        <!-- VIEW 4: FINANZAS Y CAJA -->
        <section id="view-finances" class="p-4 space-y-4 hidden flex-1 bg-neutral-950">
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800 flex justify-between items-center">
                <div>
                    <div class="text-xs text-neutral-400 uppercase font-semibold">Total en Dinero Físico</div>
                    <div id="counter-total-display" class="text-2xl font-extrabold text-emerald-400">$0</div>
                </div>
                <button onclick="resetCashCounter()" class="bg-neutral-800 text-neutral-300 text-xs px-3 py-2 rounded-lg border border-neutral-700">Limpiar</button>
            </div>
            <div class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Desglose de Denominaciones</div>
            <div id="denominations-container" class="space-y-2"></div>
            
            <div class="bg-neutral-900 p-4 rounded-xl border border-neutral-800 space-y-2 mt-4">
                <div class="text-xs font-bold text-white">Gastos de Ruta</div>
                <div class="flex gap-2">
                    <input type="text" id="expense-concept" placeholder="Concepto (Gasolina, Peaje)" class="flex-1 bg-neutral-950 border border-neutral-800 text-xs p-2 rounded text-white">
                    <input type="number" id="expense-amount" placeholder="Monto ($)" class="w-24 bg-neutral-950 border border-neutral-800 text-xs p-2 rounded text-white">
                    <button onclick="addExpense()" class="bg-rose-600 text-white px-3 py-2 rounded text-xs font-bold">+</button>
                </div>
                <div id="expenses-list" class="space-y-1 pt-2"></div>
            </div>
        </section>

        <!-- VIEW 5: REGISTRO DE ACTIVIDAD (Requisito 7) -->
        <section id="view-registro" class="p-4 space-y-2 hidden flex-1 bg-neutral-950">
            <h2 class="text-xs font-semibold text-neutral-400 uppercase tracking-wider">Registro de Operación & Sistema</h2>
            <div id="lista-registro" class="p-3 bg-neutral-900 rounded-xl border border-neutral-800 font-mono text-[11px] text-blue-400 leading-relaxed overflow-y-auto"></div>
        </section>
    </main>

    <!-- MOBILE BOTTOM NAVIGATION BAR (Routin Style) -->
    <nav class="bg-neutral-900 border-t border-neutral-800 fixed bottom-0 left-0 right-0 z-40 max-w-md mx-auto shadow-2xl">
        <div class="grid grid-cols-5 py-2">
            <button onclick="switchTab('map')" id="nav-btn-map" class="flex flex-col items-center justify-center text-blue-500 transition">
                <i data-lucide="map" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Mapa</span>
            </button>
            <button onclick="switchTab('routes')" id="nav-btn-routes" class="flex flex-col items-center justify-center text-neutral-400 hover:text-white transition">
                <i data-lucide="route" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Ruta</span>
            </button>
            <button onclick="switchTab('agenda')" id="nav-btn-agenda" class="flex flex-col items-center justify-center text-neutral-400 hover:text-white transition">
                <i data-lucide="book-user" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Agenda</span>
            </button>
            <button onclick="switchTab('finances')" id="nav-btn-finances" class="flex flex-col items-center justify-center text-neutral-400 hover:text-white transition">
                <i data-lucide="wallet" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Caja</span>
            </button>
            <button onclick="switchTab('registro')" id="nav-btn-registro" class="flex flex-col items-center justify-center text-neutral-400 hover:text-white transition">
                <i data-lucide="scroll-text" class="w-5 h-5"></i>
                <span class="text-[10px] mt-1 font-medium">Logs</span>
            </button>
        </div>
    </nav>

    <!-- MODAL NUEVA PARADA -->
    <div id="modal-parada" class="fixed inset-0 bg-black/80 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
        <div class="bg-neutral-900 border border-neutral-800 w-full max-w-sm rounded-2xl p-5 space-y-3 shadow-2xl">
            <h3 class="font-bold text-sm text-blue-400"><i data-lucide="map-pin-plus" class="w-4 h-4 inline mr-1"></i> Añadir Parada en el Punto</h3>
            <div class="space-y-2 text-xs">
                <input type="text" id="parada-nombre" placeholder="Nombre del Negocio / Cliente" class="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-white">
                <input type="text" id="parada-direccion" placeholder="Dirección o referencia" class="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-white">
                <input type="number" id="parada-valor" placeholder="Monto a cobrar ($)" class="w-full bg-neutral-950 border border-neutral-800 rounded p-2.5 text-white">
            </div>
            <div class="flex gap-2 pt-2">
                <button onclick="guardarNuevaParada()" class="flex-1 bg-blue-600 hover:bg-blue-500 text-white py-2.5 rounded-xl font-bold text-xs shadow">Guardar</button>
                <button onclick="cerrarModal()" class="flex-1 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 py-2.5 rounded-xl font-bold text-xs">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Script principal de lógica -->
    <script src="./app.js"></script>
</body>
</html>
