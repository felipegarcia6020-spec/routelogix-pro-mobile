<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RouteLogix Pro - Gestión de Rutas y Caja</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin=""/>
    <!-- PWA Manifest -->
    <link rel="manifest" href="./manifest.json">
    <meta name="theme-color" content="#2563eb">
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col font-sans">

    <!-- Header & Navigation -->
    <header class="bg-blue-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-wrap justify-between items-center gap-4">
            <div class="flex items-center space-x-3">
                <span class="text-2xl font-black tracking-wider">RouteLogix <span class="text-blue-200">Pro</span></span>
            </div>
            
            <!-- Install PWA Button (Hidden by default, shown via app.js) -->
            <button id="btnInstall" class="hidden bg-emerald-500 hover:bg-emerald-600 text-white px-3 py-1.5 rounded-lg text-sm font-semibold shadow transition flex items-center gap-1.5">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" />
                </svg>
                Instalar App
            </button>

            <!-- Navigation Tabs -->
            <nav class="flex space-x-1 bg-blue-700 p-1 rounded-xl">
                <button onclick="switchTab('map')" id="tab-map" class="px-4 py-2 rounded-lg font-medium text-sm transition bg-white text-blue-700 shadow">Mapa y Rutas</button>
                <button onclick="switchTab('cash')" id="tab-cash" class="px-4 py-2 rounded-lg font-medium text-sm transition text-blue-100 hover:bg-blue-600">Caja y Efectivo</button>
            </nav>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-grow max-w-7xl w-full mx-auto p-4 md:p-6 grid grid-cols-1 gap-6">

        <!-- Tab 1: Map and Routes -->
        <section id="content-map" class="space-y-6">
            <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- Control Panel -->
                <div class="bg-white p-5 rounded-2xl shadow-sm border border-slate-100 space-y-4">
                    <h2 class="text-lg font-bold text-slate-700 border-b pb-2">Gestión de Paradas</h2>
                    <div>
                        <label class="block text-xs font-semibold text-slate-500 uppercase mb-1">Añadir Nueva Dirección</label>
                        <div class="flex gap-2">
                            <input type="text" id="addressInput" placeholder="Ej: Carrera 7 # 32-12, Bogotá" class="flex-grow border border-slate-300 rounded-lg px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-blue-500">
                            <button onclick="addStop()" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg text-sm font-semibold transition">Agregar</button>
                        </div>
                    </div>
                    <div class="space-y-2">
                        <span class="text-xs font-semibold text-slate-500 uppercase">Paradas Registradas</span>
                        <ul id="stopsList" class="divide-y divide-slate-100 max-h-60 overflow-y-auto text-sm">
                            <!-- Dinámico -->
                        </ul>
                    </div>
                    <button onclick="calculateRoute()" class="w-full bg-slate-800 hover:bg-slate-900 text-white py-2.5 rounded-xl font-semibold text-sm transition shadow">Optimizar Ruta</button>
                </div>

                <!-- Leaflet Map Container -->
                <div class="lg:col-span-2 bg-white p-2 rounded-2xl shadow-sm border border-slate-100 h-[500px]">
                    <div id="map" class="w-full h-full rounded-xl z-0"></div>
                </div>
            </div>
        </section>

        <!-- Tab 2: Cash & Denominations Counter -->
        <section id="content-cash" class="hidden space-y-6">
            <div class="bg-white p-6 rounded-2xl shadow-sm border border-slate-100 max-w-3xl mx-auto w-full">
                <div class="flex justify-between items-center border-b pb-4 mb-4">
                    <h2 class="text-xl font-bold text-slate-800">Cuadre de Caja de Efectivo</h2>
                    <div class="text-right">
                        <span class="text-xs text-slate-500 block uppercase font-semibold">Total Acumulado</span>
                        <span id="totalCash" class="text-2xl font-black text-emerald-600">$0</span>
                    </div>
                </div>

                <!-- Denominations Grid (Includes bills and coins: 1000, 500, 200, 100, 50) -->
                <div id="denominationsGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <!-- Generado desde app.js -->
                </div>

                <div class="mt-6 flex justify-end gap-3">
                    <button onclick="resetCash()" class="bg-slate-100 hover:bg-slate-200 text-slate-600 px-4 py-2 rounded-xl text-sm font-semibold transition">Reiniciar Caja</button>
                    <button onclick="saveCash()" class="bg-blue-600 hover:bg-blue-700 text-white px-5 py-2 rounded-xl text-sm font-semibold transition shadow">Guardar Cierre</button>
                </div>
            </div>
        </section>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 py-4 text-center text-xs text-slate-400">
        RouteLogix Pro &copy; 2026 - Todos los derechos reservados.
    </footer>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>
    <!-- App Logic -->
    <script src="./app.js"></script>

    <!-- PWA Service Worker Registration -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', () => {
                navigator.serviceWorker.register('./sw.js')
                    .then(reg => console.log('Service Worker registrado con éxito:', reg.scope))
                    .catch(err => console.error('Error al registrar el Service Worker:', err));
            });
        }
    </script>
</body>
</html>
