<!DOCTYPE html>
<html lang="es" class="h-full bg-neutral-950">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RouteLogix Pro | Enterprise v22</title>

    <meta name="theme-color" content="#030712">
    <meta name="mobile-web-app-capable" content="yes">
    <link rel="manifest" href="./manifest.json">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

    <link rel="stylesheet" href="./style.css">
</head>
<body class="h-full text-gray-100 bg-neutral-950 flex flex-col justify-between selection:bg-cyan-500 selection:text-black overflow-hidden font-sans">

    <!-- AUTH SCREEN -->
    <div id="auth-screen" class="fixed inset-0 z-50 bg-neutral-950/95 backdrop-blur-xl flex flex-col items-center justify-center p-6">
        <div class="w-full max-w-sm bg-neutral-900/90 border border-cyan-500/30 rounded-3xl p-7 shadow-[0_0_50px_rgba(6,182,212,0.15)] space-y-6">
            <div class="text-center space-y-2">
                <div class="w-14 h-14 bg-gradient-to-tr from-cyan-500 to-blue-600 text-neutral-950 rounded-2xl flex items-center justify-center mx-auto mb-2 font-black text-2xl shadow-lg shadow-cyan-500/30">RL</div>
                <h1 class="text-2xl font-black text-white tracking-wider bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">ROUTELOGIX PRO</h1>
                <p class="text-xs text-neutral-400 font-medium">Enterprise Edition - v22</p>
            </div>

            <div class="flex bg-neutral-950/80 p-1.5 rounded-2xl border border-neutral-800 text-xs font-bold">
                <button type="button" onclick="switchAuthTab('login')" id="auth-tab-login" class="flex-1 py-2.5 rounded-xl bg-cyan-500 text-neutral-950 shadow-md transition-all">Iniciar Sesion</button>
                <button type="button" onclick="switchAuthTab('register')" id="auth-tab-register" class="flex-1 py-2.5 rounded-xl text-neutral-400 hover:text-white transition-all">Registrarse</button>
            </div>

            <!-- FORM LOGIN -->
            <div id="form-login" class="space-y-3.5 text-xs">
                <div>
                    <label class="block text-neutral-400 font-medium mb-1.5">Correo Electronico</label>
                    <input type="email" id="login-email" value="conductor@routelogix.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-neutral-400 font-medium mb-1.5">Contrasena</label>
                    <input type="password" id="login-pass" value="123456" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-white focus:border-cyan-500 focus:ring-1 focus:ring-cyan-500 focus:outline-none transition">
                </div>
                <button type="button" onclick="handleLoginDirect()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-neutral-950 font-black py-3.5 rounded-xl shadow-lg shadow-cyan-500/20 transition-all active:scale-95">Ingresar al Sistema</button>
            </div>

            <!-- FORM REGISTER -->
            <div id="form-register" class="space-y-3.5 text-xs hidden">
                <div>
                    <label class="block text-neutral-400 font-medium mb-1.5">Nombre Completo</label>
                    <input type="text" id="reg-name" placeholder="Carlos Perez" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-neutral-400 font-medium mb-1.5">Correo Electronico</label>
                    <input type="email" id="reg-email" placeholder="carlos@routelogix.com" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none transition">
                </div>
                <div>
                    <label class="block text-neutral-400 font-medium mb-1.5">Contrasena</label>
                    <input type="password" id="reg-pass" placeholder="********" class="w-full bg-neutral-950 border border-neutral-800 rounded-xl p-3 text-white focus:border-emerald-500 focus:outline-none transition">
                </div>
                <button type="button" onclick="handleRegisterDirect()" class="w-full bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-neutral-950 font-black py-3.5 rounded-xl shadow-lg shadow-emerald-500/20 transition-all active:scale-95">Crear Cuenta</button>
            </div>
        </div>
    </div>

    <!-- TOP HEADER -->
    <header class="bg-neutral-900/90 backdrop-blur-md border-b border-neutral-800/80 px-4 py-3 flex items-center justify-between sticky top-0 z-40 shadow-xl">
        <div class="flex items-center space-x-3 cursor-pointer group" onclick="openDriverEditModal()">
            <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-cyan-500 to-blue-600 text-neutral-950 font-black flex items-center justify-center text-sm shadow-md shadow-cyan-500/20 border border-cyan-400/30 group-hover:scale-105 transition">
                <span id="driver-initials">CP</span>
            </div>
            <div>
                <h1 id="driver-name-display" class="font-bold text-xs text-white tracking-wide">Conductor Asignado</h1>
                <div class="flex items-center gap-2 mt-0.5">
                    <span id="network-status-badge" class="px-2 py-0.5 rounded-full text-[9px] font-bold bg-emerald-500/20 text-emerald-400 border border-emerald-500/30 flex items-center gap-1">
                        <span id="network-dot" class="w-1.5 h-1.5 rounded-full bg-emerald-500 animate-pulse"></span>
                        <span id="network-text">Online</span>
                    </span>
                    <span class="text-neutral-600">•</span>
                    <span id="outbox-sync-badge" class="text-[9px] text-amber-400 hidden font-bold">📤 Sincronizando...</span>
                </div>
            </div>
        </div>
        <div class="flex items-center space-x-2">
            <!-- INSTALAR APP BUTTON -->
            <button id="pwa-install-btn" onclick="triggerPWAInstall()" class="hidden px-3 py-2 bg-gradient-to-r from-emerald-500 to-teal-600 text-neutral-950 rounded-xl text-xs font-black flex items-center gap-1.5 shadow-lg shadow-emerald-500/20 transition animate-bounce">
                <i data-lucide="download" class="w-3.5 h-3.5"></i> <span>Instalar App</span>
            </button>

            <button onclick="document.getElementById('import-file-input').click()" class="p-2.5 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-xl text-xs flex items-center border border-neutral-700/80 transition shadow-inner" title="Importar rutas">
                <i data-lucide="folder-open" class="w-4 h-4 text-cyan-400"></i>
            </button>
            <input type="file" id="import-file-input" class="hidden" accept=".bin,.json" onchange="importarArchivoRoutin(event)">

            <button onclick="logoutSession()" class="p-2.5 bg-neutral-800 hover:bg-neutral-700 text-rose-400 rounded-xl text-xs border border-neutral-700/80 transition shadow-inner" title="Cerrar sesion">
                <i data-lucide="log-out" class="w-4 h-4"></i>
            </button>
        </div>
    </header>

    <!-- MAIN APP VIEWCONTAINER -->
    <main class="flex-1 overflow-y-auto w-full mx-auto pb-24 relative flex flex-col">

        <!-- MAP VIEW -->
        <section id="view-map" class="flex-1 flex flex-col relative h-full">
            <!-- Search Bar Top -->
            <div class="absolute top-3 left-3 right-16 z-30 flex gap-2">
                <div class="flex-1 bg-neutral-900/90 backdrop-blur-md border border-neutral-700/80 rounded-2xl flex items-center px-3.5 py-2.5 shadow-2xl">
                    <i data-lucide="search" class="w-4 h-4 text-cyan-400 mr-2.5 shrink-0"></i>
                    <input type="text" id="map-search-input" placeholder="Buscar direccion o lugar..." onkeydown="if(event.key==='Enter') searchMapAddress()" class="w-full bg-transparent text-xs text-white focus:outline-none placeholder-neutral-500 font-medium">
                </div>
                <button onclick="searchMapAddress()" class="bg-cyan-500 hover:bg-cyan-400 text-neutral-950 px-4 rounded-2xl shadow-lg shadow-cyan-500/20 flex items-center justify-center text-xs font-bold transition">Ir</button>
            </div>

            <!-- Map Styles Selector -->
            <div class="absolute top-16 left-3 z-30 flex gap-1 bg-neutral-900/90 backdrop-blur-md p-1 rounded-2xl border border-neutral-700/80 text-[10px] shadow-2xl font-bold">
                <button onclick="setMapTileStyle('standard')" id="style-standard" class="px-3 py-1.5 rounded-xl bg-cyan-500 text-neutral-950 transition">Clasico</button>
                <button onclick="setMapTileStyle('dark')" id="style-dark" class="px-3 py-1.5 rounded-xl text-neutral-300 hover:text-white transition">Oscuro</button>
                <button onclick="setMapTileStyle('satellite')" id="style-satellite" class="px-3 py-1.5 rounded-xl text-neutral-300 hover:text-white transition">Satelite</button>
            </div>

            <!-- GPS Speed & Offline Download Widgets -->
            <div class="absolute top-16 right-3 z-30 flex flex-col items-end gap-2.5">
                <div id="gps-speed-widget" class="bg-neutral-900/90 backdrop-blur-md border border-cyan-500/30 px-3.5 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-2.5 text-xs">
                    <div id="transport-icon-indicator" class="text-cyan-400 text-base">🚗</div>
                    <div>
                        <div class="text-[9px] text-neutral-400 uppercase font-black tracking-wider">Velocidad GPS</div>
                        <div id="live-speed-display" class="text-white font-black text-sm">0.0 km/h</div>
                    </div>
                </div>

                <button onclick="openOfflineDownloadModal()" class="bg-neutral-900/90 hover:bg-neutral-800 backdrop-blur-md border border-emerald-500/30 px-3.5 py-2.5 rounded-2xl shadow-2xl flex items-center space-x-2.5 text-xs transition group">
                    <i data-lucide="download-cloud" class="w-4 h-4 text-emerald-400 group-hover:scale-110 transition"></i>
                    <div class="text-left">
                        <div class="text-[9px] text-neutral-400 uppercase font-black tracking-wider">Mapa Offline</div>
                        <div id="offline-map-status-text" class="text-emerald-400 font-black text-[11px]">Ver Estado</div>
                    </div>
                </button>
            </div>

            <!-- Leaflet Map Container -->
            <div id="map" class="w-full flex-1 absolute inset-0 z-0"></div>

            <!-- Target Crosshair -->
            <div class="map-crosshair absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-1/2 pointer-events-none z-20 flex items-center justify-center">
                <div class="w-10 h-10 border-2 border-dashed border-cyan-400 rounded-full animate-spin" style="animation-duration: 15s;"></div>
                <div class="absolute w-2.5 h-2.5 bg-cyan-400 rounded-full shadow-[0_0_12px_#06b6d4]"></div>
            </div>

            <!-- GPS Floating Controls -->
            <button onclick="centrarGPS()" class="absolute bottom-20 left-4 z-20 w-12 h-12 bg-neutral-900/90 backdrop-blur-md border border-neutral-700/80 rounded-2xl flex items-center justify-center text-cyan-400 shadow-2xl active:scale-95 transition" title="Mi Ubicacion GPS">
                <i data-lucide="navigation" class="w-5 h-5"></i>
            </button>

            <button onclick="toggleTrackingLive()" id="tracking-toggle-btn" class="absolute bottom-20 right-4 z-20 px-4 py-3 bg-cyan-500 hover:bg-cyan-400 text-neutral-950 rounded-2xl shadow-2xl font-black text-xs flex items-center gap-2 active:scale-95 transition">
                <i data-lucide="radio" class="w-4 h-4 animate-pulse"></i> <span>GPS Vivo: ON</span>
            </button>

            <!-- Bottom Action Bar -->
            <div class="absolute bottom-4 left-0 right-0 z-20 px-4 flex gap-2.5">
                <div class="relative flex-1">
                    <button onclick="toggleStopMenu()" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-neutral-950 font-black py-3.5 px-4 rounded-2xl shadow-2xl shadow-cyan-500/20 flex items-center justify-center gap-2 border border-cyan-400/40 text-xs active:scale-95 transition">
                        <i data-lucide="plus-circle" class="w-4 h-4"></i> Anadir Parada <i data-lucide="chevron-up" class="w-3.5 h-3.5 ml-1"></i>
                    </button>
                    <div id="stop-submenu" class="hidden absolute bottom-16 left-0 right-0 bg-neutral-900/95 backdrop-blur-xl border border-cyan-500/30 rounded-2xl p-2 shadow-2xl space-y-1.5 text-xs">
                        <button onclick="abrirModalParadaCentro()" class="w-full text-left
