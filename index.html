<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>RouteLogix Pro & Routin - Sistema TaT Unificado</title>

    <meta name="theme-color" content="#020617">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" type="image/png" href="./icon.png">

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Leaflet CSS & JS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha256-p4NxAoJBhIIN+hmNHrzRCf9tD/miZyoHS5obTRR9BMY=" crossorigin="" />
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha256-20nQCchB9co0qIjJZRGuk2/Z9VM+kNiyxNV1lvTlZBo=" crossorigin=""></script>

    <!-- FontAwesome & Custom CSS -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
    <link rel="stylesheet" href="./style.css">
</head>
<body>

    <div class="app-container">
        <!-- MAPA Y CONTROLES GPS (Requisito 1, 2, 5, 9) -->
        <div id="map-wrapper">
            <div id="map"></div>
            <!-- Cursor / Mira central de precisión (Requisito 1) -->
            <div class="map-crosshair" title="Punto exacto de puntería"></div>
            <!-- Botón flotante GPS y indicador (Requisito 2 y 5) -->
            <button class="gps-fab" onclick="centrarGPS()" title="Mi ubicación GPS">📍</button>
        </div>

        <!-- PANEL LATERAL DE CONTROL OPERATIVO -->
        <div class="sidebar" style="width: 440px; min-width: 320px; background-color: #0f172a; border-left: 1px solid #1e293b; display: flex; flex-direction: column; z-index: 1001;">
            <div class="sidebar-header" style="padding: 16px; background-color: #020617; border-bottom: 1px solid #1e293b;">
                <h2 style="margin: 0 0 10px 0; font-size: 1.15rem; color: #38bdf8; display: flex; justify-content: space-between; align-items: center;">
                    <span>RouteLogix Pro & Routin</span>
                    <span id="header-net-badge" style="font-size:0.8rem; color:#10b981; font-weight:bold;">$0</span>
                </h2>
                <div class="header-actions" style="display: flex; gap: 6px; flex-wrap: wrap;">
                    <button onclick="document.getElementById('file-bin-input').click()" style="flex:1; padding:8px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:600; font-size:0.75rem; cursor:pointer;">📁 Importar .bin</button>
                    <button onclick="abrirModalParadaCentro()" style="flex:1; padding:8px; background:#059669; color:white; border:none; border-radius:6px; font-weight:600; font-size:0.75rem; cursor:pointer;">+ Añadir Parada</button>
                    <button onclick="optimizarRuta()" style="padding:8px 10px; background:#475569; color:white; border:none; border-radius:6px; font-weight:600; font-size:0.75rem; cursor:pointer;" title="Optimizar ruta">⚡ Optimizar</button>
                    <button onclick="borrarRutaActiva()" style="padding:8px 10px; background:#7f1d1d; color:#fca5a5; border:none; border-radius:6px; font-weight:600; font-size:0.75rem; cursor:pointer;" title="Borrar ruta">🗑️</button>
                </div>
                <input type="file" id="file-bin-input" style="display:none" accept=".bin,.json" onchange="importarArchivoRoutin(event)">
            </div>

            <!-- Pestañas de Navegación del Panel (Requisito 3 - Agenda, Rutas, Finanzas, Registro) -->
            <div class="panel-tabs" style="display: flex; background: #020617; border-bottom: 1px solid #1e293b;">
                <div class="panel-tab active" id="tab-btn-rutas" onclick="cambiarPestana('rutas')" style="flex:1; padding:10px; text-align:center; font-size:0.75rem; color:#94a3b8; cursor:pointer;">Ruta</div>
                <div class="panel-tab" id="tab-btn-agenda" onclick="cambiarPestana('agenda')" style="flex:1; padding:10px; text-align:center; font-size:0.75rem; color:#94a3b8; cursor:pointer;">Agenda</div>
                <div class="panel-tab" id="tab-btn-finanzas" onclick="cambiarPestana('finanzas')" style="flex:1; padding:10px; text-align:center; font-size:0.75rem; color:#94a3b8; cursor:pointer;">Finanzas</div>
                <div class="panel-tab" id="tab-btn-registro" onclick="cambiarPestana('registro')" style="flex:1; padding:10px; text-align:center; font-size:0.75rem; color:#94a3b8; cursor:pointer;">Registro</div>
            </div>

            <div class="sidebar-content" id="sidebar-pane-rutas" style="padding: 16px; overflow-y: auto; flex: 1;">
                <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase;">Paradas de la Ruta Activa</h3>
                <div id="lista-paradas">
                    <!-- Dinámico por app.js -->
                </div>
            </div>

            <div class="sidebar-content" id="sidebar-pane-agenda" style="padding: 16px; overflow-y: auto; flex: 1; display:none;">
                <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase;">Agenda de Clientes (Requisito 3)</h3>
                <div id="lista-agenda"></div>
            </div>

            <div class="sidebar-content" id="sidebar-pane-finanzas" style="padding: 16px; overflow-y: auto; flex: 1; display:none;">
                <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase;">Control de Dinero & Caja</h3>
                <div id="denominations-container"></div>
                <h3 style="font-size: 0.8rem; color: #94a3b8; margin: 15px 0 10px 0; text-transform: uppercase;">Gastos de Ruta</h3>
                <div class="flex gap-2 mb-2">
                    <input type="text" id="expense-concept" placeholder="Concepto" class="flex-1 bg-neutral-950 border border-neutral-800 text-xs p-2 rounded text-white">
                    <input type="number" id="expense-amount" placeholder="Monto" class="w-24 bg-neutral-950 border border-neutral-800 text-xs p-2 rounded text-white">
                    <button onclick="addExpense()" class="bg-rose-600 text-white px-3 py-2 rounded text-xs font-bold">+</button>
                </div>
                <div id="expenses-list"></div>
            </div>

            <div class="sidebar-content" id="sidebar-pane-registro" style="padding: 16px; overflow-y: auto; flex: 1; display:none;">
                <h3 style="font-size: 0.8rem; color: #94a3b8; margin-bottom: 10px; text-transform: uppercase;">Registro de Actividad (Requisito 7)</h3>
                <div id="lista-registro" style="font-size: 0.75rem; font-family: monospace; color: #38bdf8; line-height: 1.4;"></div>
            </div>
        </div>
    </div>

    <!-- MODAL NUEVA PARADA -->
    <div class="modal" id="modal-parada" style="display:none; position:fixed; inset:0; background:rgba(0,0,0,0.8); z-index:2000; align-items:center; justify-content:center; padding:20px;">
        <div class="modal-content" style="background:#0f172a; border:1px solid #334155; padding:20px; border-radius:12px; width:100%; max-width:380px;">
            <h3 style="margin-bottom:12px; font-size:1.1rem; color:#38bdf8;">Nueva Parada en el Mapa</h3>
            <input type="text" id="parada-nombre" placeholder="Nombre del cliente o negocio" style="width:100%; padding:10px; margin-bottom:10px; background:#020617; border:1px solid #1e293b; color:white; border-radius:6px; font-size:0.9rem;">
            <input type="text" id="parada-direccion" placeholder="Dirección o referencia" style="width:100%; padding:10px; margin-bottom:10px; background:#020617; border:1px solid #1e293b; color:white; border-radius:6px; font-size:0.9rem;">
            <input type="number" id="parada-valor" placeholder="Monto a cobrar ($)" style="width:100%; padding:10px; margin-bottom:15px; background:#020617; border:1px solid #1e293b; color:white; border-radius:6px; font-size:0.9rem;">
            <div style="display:flex; gap:8px;">
                <button onclick="guardarNuevaParada()" style="flex:1; padding:10px; background:#2563eb; color:white; border:none; border-radius:6px; font-weight:bold; cursor:pointer;">Guardar</button>
                <button onclick="cerrarModal()" style="flex:1; padding:10px; background:#334155; color:white; border:none; border-radius:6px; cursor:pointer;">Cancelar</button>
            </div>
        </div>
    </div>

    <!-- Script principal unificado -->
    <script src="./app.js"></script>
</body>
</html>
