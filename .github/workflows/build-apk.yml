name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Build Cordova APK
        run: |
          npm install -g cordova
          cordova create myapp com.routelogix.pro RouteLogixPro
          cd myapp
          rm -rf www/*
          cp ../index.html www/
          cp ../manifest.json www/
          cp ../icon.svg www/ 2>/dev/null || true
          
          # Aceptar licencias usando la ruta completa del SDK
          yes | /cmdline-tools/latest/bin/sdkmanager --licenses || true
          
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
