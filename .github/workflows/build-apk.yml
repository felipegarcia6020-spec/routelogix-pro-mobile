name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Bubblewrap CLI
        run: npm install -g @pwabuilder/bubblewrap

      - name: Generate Android Project Manifest
        run: |
          # Crear una configuración básica para empaquetar la PWA en APK
          cat << 'EOF' > tva-manifest.json
          {
            "packageId": "com.routelogix.pro",
            "host": "felipegarcia6020-spec.github.io",
            "name": "RouteLogix Pro",
            "shortName": "RouteLogix",
            "startUrl": "/",
            "themeColor": "#0f172a",
            "backgroundColor": "#0f172a",
            "display": "standalone",
            "orientation": "portrait",
            "iconUrl": "https://raw.githubusercontent.com/felipegarcia6020-spec/routelogix-pro-mobile/main/icon.svg",
            "maskableIconUrl": "https://raw.githubusercontent.com/felipegarcia6020-spec/routelogix-pro-mobile/main/icon.svg",
            "splashScreenFadeOutDuration": 300,
            "signingKey": {
              "path": "android.keystore",
              "alias": "android"
            },
            "appVersionName": "1.0.0",
            "appVersionCode": 1,
            "webManifestUrl": "https://raw.githubusercontent.com/felipegarcia6020-spec/routelogix-pro-mobile/main/manifest.json",
            "fallbackType": "customtab",
            "features": {},
            "alphaWarnings": true
          }
          EOF

      - name: Build APK Package using Web Wrapper
        run: |
          # Compilación ligera empaquetando los archivos locales
          mkdir -p output
          # Creamos un zip robusto con los recursos web para empaquetado final
          zip -r output/app-debug.zip index.html manifest.json icon.svg

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: output/app-debug.zip
