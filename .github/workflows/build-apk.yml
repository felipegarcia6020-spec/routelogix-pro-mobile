name: Build Android APK

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Create Cordova Android Project Wrapper
        run: |
          npm install -g cordova
          cordova create myapp com.routelogix.pro RouteLogixPro --src=www || true
          cd myapp
          rm -rf www/*
          cp -r ../index.html ../manifest.json ../icon.svg ./www/ 2>/dev/null || true
          # Copia alternativa si los archivos están sueltos
          cp ../index.html www/index.html
          cp ../manifest.json www/manifest.json
          cordova platform add android
          cordova build android --debug

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: myapp/platforms/android/app/build/outputs/apk/debug/app-debug.apk
